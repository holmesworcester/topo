[package]
name = "topo"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
nom = "7.1"
iroh = { version = "0.97.0", default-features = false, features = ["address-lookup-mdns", "portmapper"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
blake3 = "1"
bao = "0.13"
base64 = "0.21"
rcgen = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
curve25519-dalek = "4"
aes-gcm = "0.10"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "1"
negentropy = { path = "vendor/negentropy" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
x509-parser = "0.16"

tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
if-addrs = "0.13"

[features]
default = ["discovery"]
discovery = []

[[bin]]
name = "topo"
path = "src/runtime/control/main.rs"

[dev-dependencies]

# Crypto deps are orders of magnitude slower in debug mode; optimize them even in tests.
[profile.release]
opt-level = "s"       # Optimize for size — reduces mapped code pages in RSS
lto = "thin"          # Cross-crate inlining + dead code elimination
strip = "symbols"     # Strip debug symbols from binary
codegen-units = 1     # Single codegen unit for better optimization

# Keep crypto crates at full speed even under size-optimized release profile.
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
[profile.release.package.ring]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3
