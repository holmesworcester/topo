[alias]
perf = "test --release --test perf_test -- --nocapture"
perf-all = "test --release --test perf_test -- --nocapture --include-ignored"
perf-file = "test --release --test file_throughput -- --nocapture"
perf-file-all = "test --release --test file_throughput -- --nocapture --include-ignored"
perf-file-rss = "test --release --test cli_large_file_rss_test rss_1gib_send_stays_bounded_single_peer -- --ignored --nocapture"
perf-topo = "test --release --test topo_cascade_test -- --nocapture"
perf-topo-all = "test --release --test topo_cascade_test -- --nocapture --include-ignored"
perf-lowmem = "test --release --test low_mem_test -- --nocapture"
perf-lowmem-all = "test --release --test low_mem_test -- --nocapture --include-ignored"

[build]
# Keep workspace-wide test/build sweeps from spawning an unbounded rustc/rust-lld
# fanout that trips systemd-oomd in tmux-backed sessions. Callers can still
# override this explicitly with `cargo -j <n> ...` when they intend to.
jobs = 4

[env]
# Default each cargo test invocation to one harness thread. Separate workstreams
# can still run distinct cargo test commands in parallel, and callers can
# override per run with `RUST_TEST_THREADS=<n> cargo test ...`.
RUST_TEST_THREADS = "1"
